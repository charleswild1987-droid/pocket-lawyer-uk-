<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" />

  <!-- Scales of Justice Central Pillar -->
  <g transform="translate(0, 10)">
    <!-- Base -->
    <path d="M196 410 L316 410 L336 430 L176 430 Z" fill="url(#gold)" />
    <rect x="226" y="380" width="60" height="30" rx="4" fill="url(#gold)" />
    
    <!-- Vertical Pillar -->
    <rect x="246" y="150" width="20" height="235" rx="6" fill="url(#gold)" />
    <circle cx="256" cy="140" r="16" fill="url(#gold)" filter="url(#glow)" />
    <polygon points="256,105 264,130 248,130" fill="url(#gold)" />

    <!-- Balance Beam -->
    <path d="M110 168 Q 256 150 402 168 L 400 178 Q 256 160 112 178 Z" fill="url(#gold)" />
    
    <!-- Left Scale -->
    <circle cx="112" cy="173" r="6" fill="url(#gold)" />
    <line x1="112" y1="173" x2="68" y2="260" stroke="#f59e0b" stroke-width="3" />
    <line x1="112" y1="173" x2="156" y2="260" stroke="#f59e0b" stroke-width="3" />
    <path d="M60 260 Q 112 300 164 260 Z" fill="url(#gold)" filter="url(#glow)" />

    <!-- Right Scale -->
    <circle cx="400" cy="173" r="6" fill="url(#gold)" />
    <line x1="400" y1="173" x2="356" y2="260" stroke="#f59e0b" stroke-width="3" />
    <line x1="400" y1="173" x2="444" y2="260" stroke="#f59e0b" stroke-width="3" />
    <path d="M348 260 Q 400 300 452 260 Z" fill="url(#gold)" filter="url(#glow)" />
    
    <!-- UK Crown / Royal Emblem hint at top -->
    <path d="M236 100 L242 85 L250 95 L256 80 L262 95 L270 85 L276 100 Z" fill="#fde68a" />
  </g>
</svg>
